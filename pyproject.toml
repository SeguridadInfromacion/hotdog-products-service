[project]
name = "hotdog-products-service"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores, I: imports, B: bugs comunes, UP: sintaxis moderna,
# S: reglas de seguridad (bandit), SIM: simplificaciones.
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
